# Test profile: H2 in-memory only. Isolated from dev DB (ayrnow_dev); never touches Postgres.
spring:
  datasource:
    url: jdbc:h2:mem:ayrnow_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: change_me_dev_secret_min_32_characters_long_for_hmac256
  expirationMinutes: 1440
