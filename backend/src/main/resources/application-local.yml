spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ayrnow
    username: ayrnow
    password: ayrnow
  flyway:
    enabled: true
    locations: classpath:db/migration/base,classpath:db/migration/seed

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.ayrnow: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
