server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ayrnow_dev}
    username: ${DB_USER:ayrnow_app}
    password: ${DB_PASSWORD:ayrnow_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    # Keep base+seed for now; we will tighten later when we add staging/prod.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration/base,classpath:db/migration/seed}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

jwt:
  secret: ${JWT_SECRET:change_me_dev_secret_min_32_characters_long_for_hmac256}
  expirationMinutes: 1440

stripe:
  secretKey: ${STRIPE_SECRET_KEY:}

ayrnow:
  cors:
    # Local default allows all; set this in AWS to your real domains.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # Base URL for email links (verify, reset). Use HTTPS in production.
  app-base-url: ${APP_BASE_URL:http://localhost:8080}

# SES (env only; no secrets in repo)
ses:
  region: ${AWS_REGION:us-east-1}
  from-email: ${SES_FROM_EMAIL:}
  from-name: ${SES_FROM_NAME:AYRNOW}
